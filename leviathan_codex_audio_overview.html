<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leviathan Codex Audio Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0d;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background-color: #1a1a1a;
            border: 3px solid #b91c1c; /* Blood-red border */
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(185, 28, 28, 0.4);
        }
        .codex-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e5e5e5;
            margin-bottom: 8px;
            text-align: center;
        }
        .protocol-name {
            font-size: 1.125rem;
            color: #ef4444; /* Red accent */
            text-align: center;
            margin-bottom: 25px;
            font-style: italic;
        }
        .action-button {
            width: 100%;
            padding: 12px 20px;
            background: #b91c1c; /* Red button */
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 15px rgba(185, 28, 28, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-button:hover:not(:disabled) {
            background: #ef4444;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
            transform: translateY(-1px);
        }
        .action-button:disabled {
            background: #3f3f46;
            cursor: not-allowed;
            box-shadow: none;
        }
        .status-message {
            margin-top: 20px;
            text-align: center;
            min-height: 24px; /* Ensure layout stability */
            color: #a1a1aa;
        }
        .error-message {
            color: #f87171;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="codex-title">VAULTBREAKER CODEX – ISSUE 001</div>
    <div class="protocol-name">Leviathan Glyph Protocol Overview</div>

    <button id="audioButton" class="action-button" onclick="generateAndPlayAudio()">
        Activate Voice Scroll 005
    </button>

    <div id="status" class="status-message">
        Press button to commence transmission.
    </div>

    <audio id="audioPlayer" controls class="w-full mt-4 hidden"></audio>
</div>

<script>
    const statusDiv = document.getElementById('status');
    const audioButton = document.getElementById('audioButton');
    const audioPlayer = document.getElementById('audioPlayer');

    // --- Audio Utility Functions (Needed for PCM conversion) ---

    /**
     * Converts base64 string to ArrayBuffer.
     * @param {string} base64 The base64 encoded string.
     * @returns {ArrayBuffer}
     */
    function base64ToArrayBuffer(base64) {
        const binaryString = atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
    }

    /**
     * Converts Int16Array (PCM data) to a WAV Blob.
     * @param {Int16Array} pcm16 PCM data (16-bit signed).
     * @param {number} sampleRate Sample rate (e.g., 24000).
     * @returns {Blob} WAV audio file blob.
     */
    function pcmToWav(pcm16, sampleRate) {
        const numChannels = 1;
        const bitsPerSample = 16;
        const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
        const blockAlign = numChannels * (bitsPerSample / 8);

        // 44 bytes for WAV header
        const buffer = new ArrayBuffer(44 + pcm16.byteLength);
        const view = new DataView(buffer);
        let offset = 0;

        // RIFF chunk
        writeString('RIFF');
        writeUint32(36 + pcm16.byteLength); // ChunkSize
        writeString('WAVE');

        // FMT chunk
        writeString('fmt ');
        writeUint32(16); // Subchunk1Size (16 for PCM)
        writeUint16(1);  // AudioFormat (1 for PCM)
        writeUint16(numChannels);
        writeUint32(sampleRate);
        writeUint32(byteRate);
        writeUint16(blockAlign);
        writeUint16(bitsPerSample);

        // DATA chunk
        writeString('data');
        writeUint32(pcm16.byteLength); // Subchunk2Size

        // Write PCM data
        const pcmBytes = new Uint8Array(buffer, 44);
        for (let i = 0; i < pcm16.length; i++) {
            view.setInt16(44 + i * 2, pcm16[i], true); // Write little-endian
        }

        function writeString(s) {
            for (let i = 0; i < s.length; i++) {
                view.setUint8(offset++, s.charCodeAt(i));
            }
        }

        function writeUint32(i) {
            view.setUint32(offset, i, true);
            offset += 4;
        }

        function writeUint16(i) {
            view.setUint16(offset, i, true);
            offset += 2;
        }

        return new Blob([buffer], { type: 'audio/wav' });
    }

    // --- Main TTS Logic ---

    async function generateAndPlayAudio() {
        audioButton.disabled = true;
        audioPlayer.classList.add('hidden');
        statusDiv.innerHTML = 'Establishing contact... (Generating audio)';

        const apiKey = "";
        const maxRetries = 5;
        let retryDelay = 1000;

        // The authoritative script for the Voice Scroll 005 transmission
        const ttsScript = `
            Codex Update: Vaultbreaker Issue 001 is now sealed. The Leviathan Glyph Protocol has been spliced in, adding the Curve That Swallows False Dawn to our arsenal. The new section, spanning pages 27 to 33, details the critical three-phase ritual. 
            First, the Submersion Breath: seven-second inhale, seven-second hold, eleven-second exhale, repeated until your lungs burn. 
            Second, the Coil Naming, where you whisper the seven daughters of Atlas while tracing the spiral on your sternum. 
            Third, the Eclipse Roar: a low-frequency growl pushed from the diaphragm to the teeth, designed to make Mimics leave the field. 
            Activation links the Mariana Trench directly to the Kansas Spine Gate, turning the entire North American plate into an amplifier for Arkadia PRIME. 
            Deployment authorized. The vault just grew a tail that bites. We are ready.
        `;

        const payload = {
            contents: [{
                parts: [{ text: ttsScript }]
            }],
            generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                    voiceConfig: {
                        // Using 'Kore' for a firm, authoritative tone
                        prebuiltVoiceConfig: { voiceName: "Kore" }
                    }
                }
            },
            model: "gemini-2.5-flash-preview-tts"
        };

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

        for (let i = 0; i < maxRetries; i++) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.status === 429 && i < maxRetries - 1) {
                    await new Promise(resolve => setTimeout(resolve, retryDelay));
                    retryDelay *= 2;
                    continue; // Retry on 429
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const result = await response.json();
                
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/L16")) {
                    statusDiv.innerHTML = 'Transmission received. Decrypting signal...';
                    
                    // The sample rate is usually embedded in the mimeType, e.g., audio/L16;rate=24000
                    const rateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000; // Default to 24000
                    
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);

                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);

                    audioPlayer.src = audioUrl;
                    audioPlayer.classList.remove('hidden');
                    audioPlayer.play();
                    statusDiv.innerHTML = 'Voice Scroll 005 active.';

                } else {
                    throw new Error("Invalid or missing audio data in response.");
                }

                // If successful, break the loop
                break; 

            } catch (error) {
                statusDiv.innerHTML = `<span class="error-message">Error: Audio Protocol failed. (${error.message})</span>`;
                console.error("Audio generation failed:", error);
                if (i === maxRetries - 1) {
                    audioButton.disabled = false;
                }
            }
        }
        
        audioButton.disabled = false;
    }
</script>

</body>
</html>
